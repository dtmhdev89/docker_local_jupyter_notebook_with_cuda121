services:
  jupyterapp:
    build:
      dockerfile: Dockerfile.colab_like
    image: jupyterapp-img:${TAG:-latest}
    tty: true
    stdin_open: true
    restart: always
    platform: linux/amd64
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''
    volumes:
      - .:/workspace:delegated
    ports:
      - 8888:8888
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            device_ids: ['0']
            capabilities: [gpu]
